<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>模拟 Edge 浏览器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI",Microsoft YaHei,sans-serif;}
body{height:100vh;display:flex;flex-direction:column;background:#e8e8e8;overflow:hidden;}

/* 顶部工具栏 */
.edge-top{
    display:flex;align-items:center;gap:6px;padding:6px 8px;background:#f1f1f1;border-bottom:1px solid #ccc;
}
.nav-group{display:flex;gap:4px;}
.btn{
    width:28px;height:28px;border:none;border-radius:4px;background:#ffffff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;
}
.btn:hover{background:#e4e4e4;}
.btn.disabled{opacity:0.35;pointer-events:none;cursor:default;}

.address-wrap{flex:1;}
#Input{
    width:100%;height:28px;padding:0 10px;border:1px solid #cccccc;border-radius:4px;font-size:13px;
}

/* 右上角菜单 */
.menu{width:30px;}
#edgeMenu{
    position:absolute;top:42px;right:10px;width:220px;background:#fff;border:1px solid #bbb;
    border-radius:4px;box-shadow:2px 2px 8px rgba(0,0,0,0.2);z-index:999;
}
.edge-menu-item{
    padding:7px 12px;cursor:default;font-size:13px;
}
.edge-menu-item:hover{background:#dcebfa;}

/* 快捷链接栏 */
.links{
    display:flex;gap:2px;padding:4px 8px;background:#f7f7f7;border-bottom:1px solid #ddd;
}
.links a{
    font-size:13px;padding:4px 10px;text-decoration:none;color:#222;border-radius:3px;
}
.links a:hover{background:#e2e2e2;}

/* iframe主体 */
.frame-container{flex:1;overflow:hidden;}
#frame{width:100%;height:100%;border:none;}
</style>
</head>
<body>

<div class="edge-top">
    <div class="nav-group">
        <button class="btn back">←</button>
        <button class="btn forward">→</button>
        <button class="btn reload">⟳</button>
        <button class="btn home">🏠</button>
    </div>
    <div class="address-wrap">
        <input id="Input" type="text" placeholder="输入网址或搜索">
    </div>
    <button class="btn menu">⋯</button>
</div>

<div id="edgeMenu" hidden>
    <div class="edge-menu-item" data‑act="home">主页</div>
    <div class="edge-menu-item" data‑act="about">关于</div>
</div>

<div class="links">
    <a data‑href="https://cn.bing.com/">必应</a>
    <a data‑href="https://github.com/">Github</a>
</div>

<div class="frame-container">
    <iframe id="frame"></iframe>
</div>

<script src="./edge.js"></script>
</body>
</html>
